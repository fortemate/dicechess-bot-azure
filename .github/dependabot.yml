version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "08:00"
    open-pull-requests-limit: 5
    assignees:
      - "rabestro"
    labels:
      - "ci-cd"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "sbt"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
    open-pull-requests-limit: 5
    assignees:
      - "rabestro"
    labels:
      - "dependencies"
      - "ci-cd"
    commit-message:
      prefix: "chore"
    ignore:
      # ANY sbt major bump is a deliberate, manual migration, never an automated one:
      # plugins must first be republished for the new sbt binary version, and the build
      # definition itself needs rewriting.
      - dependency-name: "org.scala-sbt:sbt"
        update-types: ["version-update:semver-major"]
